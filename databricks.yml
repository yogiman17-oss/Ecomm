# Declarative Automation Bundle: Ecommerce SDP medallion pipeline with unit + integration tests.
#
# Promotion flow (version-controlled via the Ecomm Git folder / GitHub repo):
#   dev  -> each developer gets an isolated, name-prefixed copy (schema dev_<user>_ecommerce_dev)
#   test -> shared CI target, schema ecommerce_test, run on every merge before promotion
#   prod -> production mode, schema ecommerce_prod, deployable only from the main branch, scheduled daily
bundle:
  name: ecommerce_sdp_cicd

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds every layer (raw volume, bronze, silver, gold).
    default: lakemeter_catalog
  schema:
    description: Target schema for the pipeline and raw volume. Development mode prefixes it with the developer name.
    default: ecommerce_dev
  schedule_pause_status:
    description: Pause status of the daily CI/CD job schedule (PAUSED or UNPAUSED).
    default: PAUSED

targets:
  dev:
    mode: development
    default: true

  test:
    presets:
      name_prefix: '[test] '
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/test
    variables:
      schema: ecommerce_test

  prod:
    mode: production
    git:
      branch: main
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/prod
    variables:
      schema: ecommerce_prod
      schedule_pause_status: UNPAUSED
    permissions:
      - level: CAN_MANAGE
        user_name: ${workspace.current_user.userName}
